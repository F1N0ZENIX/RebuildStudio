name: Build, test and release Rebuild Studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuildstudio-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-release:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: |
          dotnet restore src/RebuildStudio.App/RebuildStudio.App.csproj
          dotnet restore tests/RebuildStudio.Tests/RebuildStudio.Tests.csproj

      - name: Build
        run: dotnet build src/RebuildStudio.App/RebuildStudio.App.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet test tests/RebuildStudio.Tests/RebuildStudio.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Publish single-file self-contained EXE
        run: >
          dotnet publish src/RebuildStudio.App/RebuildStudio.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Verify single EXE output
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "publish/RebuildStudioAI.exe"
          if (!(Test-Path $exe)) { throw "Publish did not produce RebuildStudioAI.exe" }
          $files = @(Get-ChildItem publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "RebuildStudioAI.exe") {
            $files | ForEach-Object { Write-Host $_.Name }
            throw "Publish directory must contain only RebuildStudioAI.exe"
          }
          "exe_path=$exe" >> $env:GITHUB_OUTPUT
        id: verify

      - name: Resolve version and unique release tag
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $version = $props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.1.0" }
          $tag = "v$version-build.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create one release with one EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RebuildStudio release ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            Build automático do Rebuild Studio para Windows x64.

            - Arquivo único: RebuildStudioAI.exe
            - Publicação self-contained: não exige instalar o .NET separadamente.
            - O release só é criado após compilação e testes bem-sucedidos.
          files: publish/RebuildStudioAI.exe
          fail_on_unmatched_files: true
          generate_release_notes: true

  pull-request-check:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: |
          dotnet restore src/RebuildStudio.App/RebuildStudio.App.csproj
          dotnet restore tests/RebuildStudio.Tests/RebuildStudio.Tests.csproj
      - name: Build and test
        run: |
          dotnet build src/RebuildStudio.App/RebuildStudio.App.csproj -c Release --no-restore
          dotnet test tests/RebuildStudio.Tests/RebuildStudio.Tests.csproj -c Release --no-restore
